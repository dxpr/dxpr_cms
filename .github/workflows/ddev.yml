name: DXPR CMS DDEV

on:
  push:
    branches: [ 1.x, wip ]
  pull_request:
    branches: [ 1.x ]
  workflow_run:
    workflows: [ Main ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout

      # See https://ddev.readthedocs.io/en/stable/users/install/ddev-installation/#debianubuntu
      - name: Install DDEV
        run: |
          sudo sh -c 'echo ""'
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://pkg.ddev.com/apt/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/ddev.gpg > /dev/null
          sudo chmod a+r /etc/apt/keyrings/ddev.gpg
          sudo sh -c 'echo ""'
          echo "deb [signed-by=/etc/apt/keyrings/ddev.gpg] https://pkg.ddev.com/apt/ * *" | sudo tee /etc/apt/sources.list.d/ddev.list >/dev/null
          sudo sh -c 'echo ""'
          sudo apt update && sudo apt install -y ddev

      - name: Start DXPR CMS DDEV Environment
        run: |
          ddev start

      - name: Wait for services to be ready
        run: |
          # Wait for database to be ready
          ddev exec "mysqladmin ping -h db -u db -pdb --wait --retry=15"
          # Wait for web service to be ready
          timeout 20 bash -c 'until ddev exec "curl -f http://localhost" &>/dev/null; do sleep 2; done'

      - name: Install Drupal with DXPR CMS
        run: |
          ddev drush site:install --yes --db-url="mysql://db:db@db:3306/db" --account-name=admin --account-pass=admin
          
      - name: Apply DXPR CMS recipes
        run: |
          ddev drush recipe dxpr_cms_starter

      - name: Test installation
        run: |
          # Test that the site responds
          ddev exec "curl -f http://localhost" || exit 1
          # Test that we can access the admin interface
          ddev drush user:login --name=admin --uri=$(ddev describe | grep "Primary URL" | awk '{print $3}')
          echo "DXPR CMS installation completed successfully!"

      - name: Show site status
        run: |
          ddev drush status
