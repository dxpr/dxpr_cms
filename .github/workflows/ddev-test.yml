name: DXPR CMS DDEV Test Suite

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Specific recipe to test (e.g., dxpr_cms_forms). Leave empty to test all.'
        required: false
        type: string

jobs:
  setup:
    name: Setup DXPR CMS Test Environment
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/test')
    outputs:
      recipes: ${{ steps.matrix.outputs.recipes }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}
    
    steps:
      - name: Add reaction to comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('number', pr.data.number);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.pr.outputs.sha }}

      - name: Generate test matrix
        id: matrix
        run: |
          if [[ "${{ github.event.comment.body }}" =~ /test[[:space:]]+([a-zA-Z0-9_]+) ]]; then
            recipe="${BASH_REMATCH[1]}"
            echo "recipes=[\"$recipe\"]" >> $GITHUB_OUTPUT
            echo "Testing specific recipe: $recipe"
          else
            # Generate list of recipes with tests - simpler approach
            recipe_list=""
            for recipe_dir in recipes/*/tests; do
              if [ -d "$recipe_dir" ]; then
                recipe_name=$(basename $(dirname "$recipe_dir"))
                if [ -z "$recipe_list" ]; then
                  recipe_list="\"$recipe_name\""
                else
                  recipe_list="$recipe_list,\"$recipe_name\""
                fi
              fi
            done
            echo "recipes=[$recipe_list]" >> $GITHUB_OUTPUT
            echo "Testing all recipes with tests"
          fi

  phpunit-tests:
    name: PHPUnit Tests (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.recipes != '[]'
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJson(needs.setup.outputs.recipes) }}
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.pr_sha }}

      - name: Install DDEV
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://pkg.ddev.com/apt/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/ddev.gpg > /dev/null
          sudo chmod a+r /etc/apt/keyrings/ddev.gpg
          sudo sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/ddev.gpg] https://pkg.ddev.com/apt/ * *" > /etc/apt/sources.list.d/ddev.list'
          sudo apt update && sudo apt install -y ddev

      - name: Start DDEV and install DXPR CMS
        run: |
          ddev start
          ddev drush site:install dxpr_cms_installer --yes --db-url="mysql://db:db@db:3306/db" --account-name=admin --account-pass=admin

      - name: Run PHPUnit tests for ${{ matrix.recipe }}
        run: |
          echo "Testing recipe: ${{ matrix.recipe }}"
          if [ -d "recipes/${{ matrix.recipe }}/tests/src" ]; then
            ddev exec vendor/bin/phpunit --configuration=web/core --display-skipped recipes/${{ matrix.recipe }}/tests/src
          else
            echo "No PHPUnit tests found for ${{ matrix.recipe }}"
          fi

  cypress-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.pr_sha }}

      - name: Install DDEV
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://pkg.ddev.com/apt/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/ddev.gpg > /dev/null
          sudo chmod a+r /etc/apt/keyrings/ddev.gpg
          sudo sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/ddev.gpg] https://pkg.ddev.com/apt/ * *" > /etc/apt/sources.list.d/ddev.list'
          sudo apt update && sudo apt install -y ddev

      - name: Start DDEV with Selenium
        run: |
          # Start DDEV with selenium service
          ddev start
          # Install DXPR CMS
          ddev drush site:install dxpr_cms_installer --yes --db-url="mysql://db:db@db:3306/db" --account-name=admin --account-pass=admin

      - name: Install Node.js dependencies
        run: |
          ddev exec npm clean-install

      - name: Run E2E tests
        run: |
          if [[ "${{ github.event.comment.body }}" =~ /test[[:space:]]+([a-zA-Z0-9_]+) ]]; then
            recipe="${BASH_REMATCH[1]}"
            if [ -d "recipes/$recipe/tests/e2e" ]; then
              echo "Running E2E tests for $recipe"
              ddev exec npm test -- --spec="recipes/$recipe/tests/e2e/*.cy.js"
            else
              echo "No E2E tests found for $recipe"
            fi
          else
            echo "Running all E2E tests"
            ddev exec npm test
          fi

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

  full-test-suite:
    name: Full DDEV Test Suite
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ !contains(github.event.comment.body, '/test ') || contains(github.event.comment.body, '/test all') }}
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.pr_sha }}

      - name: Install DDEV
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://pkg.ddev.com/apt/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/ddev.gpg > /dev/null
          sudo chmod a+r /etc/apt/keyrings/ddev.gpg
          sudo sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/ddev.gpg] https://pkg.ddev.com/apt/ * *" > /etc/apt/sources.list.d/ddev.list'
          sudo apt update && sudo apt install -y ddev

      - name: Start DDEV and install DXPR CMS  
        run: |
          ddev start
          ddev drush site:install dxpr_cms_installer --yes --db-url="mysql://db:db@db:3306/db" --account-name=admin --account-pass=admin

      - name: Run full DDEV test suite
        run: |
          echo "Running complete DDEV test suite..."
          ddev test

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            web/sites/simpletest
          retention-days: 7

  report-results:
    name: Report Test Results
    runs-on: ubuntu-latest
    needs: [setup, phpunit-tests, cypress-tests, full-test-suite]
    if: always() && needs.setup.result == 'success'
    
    steps:
      - name: Report success
        if: needs.phpunit-tests.result == 'success' && needs.cypress-tests.result == 'success' && (needs.full-test-suite.result == 'success' || needs.full-test-suite.result == 'skipped')
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ needs.setup.outputs.pr_number }}
          body: |
            ## ✅ Tests Passed!
            
            All DXPR CMS tests completed successfully on commit ${{ needs.setup.outputs.pr_sha }}.
            
            **Test Results:**
            - PHPUnit Tests: ✅ Passed
            - Cypress E2E Tests: ✅ Passed
            - Full Test Suite: ✅ Passed

      - name: Report failure
        if: needs.phpunit-tests.result == 'failure' || needs.cypress-tests.result == 'failure' || needs.full-test-suite.result == 'failure'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ needs.setup.outputs.pr_number }}
          body: |
            ## ❌ Tests Failed
            
            Some DXPR CMS tests failed on commit ${{ needs.setup.outputs.pr_sha }}.
            
            **Test Results:**
            - PHPUnit Tests: ${{ needs.phpunit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}
            - Cypress E2E Tests: ${{ needs.cypress-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}
            - Full Test Suite: ${{ needs.full-test-suite.result == 'success' && '✅ Passed' || needs.full-test-suite.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }}
            
            Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. 