name: DXPR CMS DDEV Installation Test

on:
  push:
    branches: [ 1.x, wip ]
  pull_request:
    branches: [ 1.x ]
  workflow_run:
    workflows: [ Main ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  install:
    name: Test DXPR CMS Installation
    runs-on: ubicloud-standard-4

    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # https://github.com/marketplace/actions/checkout

      # See https://ddev.readthedocs.io/en/stable/users/install/ddev-installation/#debianubuntu
      - name: Install DDEV
        run: |
          sudo sh -c 'echo ""'
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://pkg.ddev.com/apt/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/ddev.gpg > /dev/null
          sudo chmod a+r /etc/apt/keyrings/ddev.gpg
          sudo sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/ddev.gpg] https://pkg.ddev.com/apt/ * *" > /etc/apt/sources.list.d/ddev.list'
          sudo apt update && sudo apt install -y ddev

      - name: Start DXPR CMS DDEV Environment
        run: |
          ddev config --project-type=drupal11 --database=mariadb:11.4 --docroot=web && ddev start && ddev composer install --no-interaction --no-progress --optimize-autoloader

      - name: Install Drupal with DXPR CMS
        run: |
          ddev drush site:install dxpr_cms_installer dxpr_cms_installer_keys.dxpr_key='${{ secrets.DXPR_KEY }}' --yes --db-url="mysql://db:db@db:3306/db" --account-name=admin --account-pass=admin

      - name: Show site status
        run: |
          ddev status
          ddev drush status


      - name: Test installation
        run: |
          # Test that the home page responds and contains demo content
          HOME_HTML=$(curl -fL http://dxpr-cms.ddev.site)
          echo "$HOME_HTML" | grep -q "DXPR Builder" || { echo "FAIL: Home page missing expected demo content"; exit 1; }
          echo "Home page demo content verified."
          # Test that we can access the admin interface
          ddev drush user:login --name=admin --uri=$(ddev describe | grep "Primary URL" | awk '{print $3}')
          echo "DXPR CMS installation completed successfully!"

      - name: Test contrib integrations
        run: |
          SITE_URL=http://dxpr-cms.ddev.site
          # Log in as admin with a one-time login link and keep the session.
          rm -f cookies.txt
          LOGIN_URL=$(ddev drush user:login --name=admin --no-browser --uri=$SITE_URL)
          curl -fsSL -c cookies.txt -b cookies.txt -o /dev/null "$LOGIN_URL"
          # Add Content by Bundle renders the add link in the blog listing header.
          BLOG_HTML=$(curl -fsS -b cookies.txt "$SITE_URL/blog")
          grep -q 'href="/node/add/blog?destination=/blog"' <<< "$BLOG_HTML" || { echo "FAIL: Blog listing missing add content link"; exit 1; }
          # Tagify renders the tags widget on the blog form.
          FORM_HTML=$(curl -fsS -b cookies.txt "$SITE_URL/node/add/blog")
          grep -q 'tagify-widget' <<< "$FORM_HTML" || { echo "FAIL: Blog form missing Tagify widget"; exit 1; }
          # Ace Editor finds the library that Composer installs.
          curl -fsS -o /dev/null "$SITE_URL/libraries/ace/src-min-noconflict/ace.js" || { echo "FAIL: Ace library not served"; exit 1; }
          echo "Contrib integrations verified."

      - name: Show site status
        run: |
          ddev drush status
