name: Drupal quality

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drupal-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, gd, mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Check against Drupal 12
        run: |
          site="$(mktemp -d)"
          rsync -a --exclude=.git --exclude=vendor "$GITHUB_WORKSPACE/" "$site/"
          cd "$site"
          composer require 'drupal/core-recommended:^12@beta' 'drupal/core-composer-scaffold:^12@beta' \
            'drupal/core-project-message:^12@beta' 'drupal/core-dev:^12@beta' --no-update
          analyse=(web/modules/custom web/profiles/dxpr_cms_installer recipes)
          composer config allow-plugins.phpstan/extension-installer false
          composer require --dev 'phpstan/phpstan:^2' 'mglaman/phpstan-drupal:^2' \
            'phpstan/phpstan-deprecation-rules:^2' --no-update
          composer update --no-interaction --prefer-dist --no-progress --no-scripts

          cat > drupal-quality.neon <<'NEON'
          includes:
              - vendor/mglaman/phpstan-drupal/extension.neon
              - vendor/mglaman/phpstan-drupal/rules.neon
              - vendor/phpstan/phpstan-deprecation-rules/rules.neon
          parameters:
              level: 1
              drupal:
                  drupal_root: web
          NEON
          vendor/bin/phpstan analyse --configuration=drupal-quality.neon --no-progress --memory-limit=1G "${analyse[@]}"
