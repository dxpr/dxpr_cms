custom_css_site: ".content .az-container > .az-section { padding-top: 100px;padding-bottom: 100px; }\r\n.content img { border-radius: 20px; }\r\n.az-icon { margin-bottom: 30px; }\r\n.body--dxpr-theme-nav-desktop .dxpr-theme-header--top .nav>li>a, .body--dxpr-theme-nav-desktop .dxpr-theme-header--top .nav>li>span { font-size: 0.875rem; }\r\n:root {\r\n--bs-success: #1E9E5A;\r\n--bs-success-rgb: 30,158,90;\r\n--bs-success-text-emphasis: #0C3F24;\r\n--bs-success-bg-subtle: #DDF3E8;\r\n--bs-success-border-subtle: #B0E5CB;\r\n--bs-danger: #EF3340;\r\n--bs-danger-rgb: 239,51,64;\r\n--bs-danger-text-emphasis: #60141A;\r\n--bs-danger-bg-subtle: #F9E1E4;\r\n--bs-danger-border-subtle: #F5B3B9;\r\n--bs-warning: #FFC107;\r\n--bs-warning-rgb: 255,193,7;\r\n--bs-warning-text-emphasis: #664D03;\r\n--bs-warning-bg-subtle: #F7EDC8;\r\n--bs-warning-border-subtle: #FFE69C;\r\n--bs-info: #21C1E8;\r\n--bs-info-rgb: 33,193,232;\r\n--bs-info-text-emphasis: #0D4D5D;\r\n--bs-info-bg-subtle: #D9F3FA;\r\n--bs-info-border-subtle: #A8E3F3;\r\n--bs-light: #F3F4F6;\r\n--bs-light-rgb: 243,244,246;\r\n--bs-light-bg-subtle: #FAFBFC;\r\n--bs-dark-bg-subtle: #D5DBE4;\r\n--bs-body-secondary-bg: #F2F3F5;\r\n--bs-tertiary-bg: #F7F8FA;\r\n}\r\n.btn-success { --bs-btn-bg: #1E9E5A; --bs-btn-border-color: #1E9E5A; --bs-btn-hover-bg: #187E48; --bs-btn-hover-border-color: #187E48; }\r\n.btn-danger { --bs-btn-bg: #EF3340; --bs-btn-border-color: #EF3340; --bs-btn-hover-bg: #BF2933; --bs-btn-hover-border-color: #BF2933; }\r\n.btn-warning { --bs-btn-bg: #FFC107; --bs-btn-border-color: #FFC107; --bs-btn-hover-bg: #CC9A06; --bs-btn-hover-border-color: #CC9A06; }\r\n.btn-info { --bs-btn-bg: #21C1E8; --bs-btn-border-color: #21C1E8; --bs-btn-hover-bg: #1A9ABA; --bs-btn-hover-border-color: #1A9ABA; }\r\n.bg-success { background-color: #1E9E5A !important; }\r\n.bg-success-subtle { background-color: #DDF3E8 !important; }\r\n.bg-danger { background-color: #EF3340 !important; }\r\n.bg-danger-subtle { background-color: #F9E1E4 !important; }\r\n.bg-warning { background-color: #FFC107 !important; }\r\n.bg-warning-subtle { background-color: #F7EDC8 !important; }\r\n.bg-info { background-color: #21C1E8 !important; }\r\n.bg-info-subtle { background-color: #D9F3FA !important; }"
