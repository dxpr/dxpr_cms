name: AI LinkedIn Posts
type: DXPR CMS
description: Adds LinkedIn-specific AI social post generation capabilities. Requires the AI Assistant recipe to be installed first.
install:
  - ai_social_posts_linkedin
  - ai_social_posts_linkedin_article
recipes:
  - dxpr_cms_ai
config:
  strict: false
  import:
    ai_social_posts_linkedin: '*'
    ai_social_posts_linkedin_article: '*'
  actions:
    # Grant permissions to roles for AI Social Posts
    user.role.content_editor:
      grantPermissions:
        - 'add ai_social_post entity'
        - 'edit ai_social_post entity'
        - 'view ai_social_post entity'
        - 'use text format ai_social_posts'
    user.role.content_administrator:
      grantPermissions:
        - 'add ai_social_post entity'
        - 'edit ai_social_post entity'
        - 'view ai_social_post entity'
        - 'delete ai_social_post entity'
        - 'use text format ai_social_posts'
    user.role.site_builder:
      grantPermissions:
        - 'add ai_social_post entity'
        - 'edit ai_social_post entity'
        - 'view ai_social_post entity'
        - 'delete ai_social_post entity'
        - 'administer ai_social_post entity'
        - 'administer ai_social_post types'
        - 'use text format ai_social_posts'
