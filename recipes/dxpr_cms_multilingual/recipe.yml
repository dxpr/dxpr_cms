name: 'Multilingual support'
type: 'DXPR CMS'
description: 'Adds support for translations.'
recipes:
  - dxpr_cms_content_type_base
  - dxpr_cms_dxpr_builder
  - dxpr_cms_ai
  - dxpr_cms_roles
install:
  - config_translation
  - content_translation
  - block_content
  - hreflang
  - lang_dropdown
  - language
  - locale
  - node
  - tmgmt
  - tmgmt_locale
  - tmgmt_content
  - tmgmt_config
  - ai_tmgmt
  - ai_translate
  - user
  - dxpr_cms_multilingual_content
config:
  strict: false
  import:
    language: '*'
    tmgmt: '*'
    ai_translate: '*'
  actions:
    # Enable browser language detection alongside URL prefix.
    language.types:
      simpleConfigUpdate:
        negotiation:
          language_interface:
            enabled:
              language-url: 0
              language-browser: 1
              language-selected: 2
          language_content:
            enabled:
              language-interface: 0
          language_url:
            enabled:
              language-url: 0
              language-url-fallback: 1
    # Use URL path prefix for non-default languages; the default language
    # (English) serves from the root URL without a prefix.
    language.negotiation:
      simpleConfigUpdate:
        url:
          source: path_prefix
          prefixes:
            en: ''
    # Configure translations for content.
    node.type.*:
      createForEachIfNotExists:
        'language.content_settings.node.%bundle':
          target_entity_type_id: node
          target_bundle: '%bundle'
          language_alterable: true
    language.content_settings.node.*:
      setThirdPartySettings:
        -
          module: content_translation
          key: enabled
          value: true
        -
          module: content_translation
          key: bundle_settings
          value:
            untranslatable_fields_hide: '1'
    ai_translate.settings:
      simpleConfigUpdate:
        reference_defaults:
          - node
    tmgmt.translator.ai:
      simpleConfigUpdate:
        auto_accept: true
        settings:
          model_selection_type: ai_translate
          chat_model: dxpr__kavya-m1-fast
          tokenizer_model: dxpr__kavya-m1-fast
          advanced:
            max_tokens: 999996
    user.role.content_administrator:
      grantPermissionsForEachNodeType:
        - 'translate %bundle node'
      grantPermissions:
        - 'create content translations'
        - 'delete content translations'
        - 'update content translations'
        - 'accept translation jobs'
        - 'create translation jobs'
        - 'submit translation jobs'
        - 'translate block_content'
        - 'translate editable entities'
        - 'translate menu_link_content'
        - 'translate tags taxonomy_term'
        - 'create ai content translation'
        - 'create ai interface translation'
    user.role.content_editor:
      grantPermissionsForEachNodeType:
        - 'translate %bundle node'
      grantPermissions:
        - 'create content translations'
        - 'delete content translations'
        - 'update content translations'
        - 'translate editable entities'
        - 'translate tags taxonomy_term'
        - 'create ai content translation'
    user.role.site_builder:
      grantPermissionsForEachNodeType:
        - 'translate %bundle node'
      grantPermissions:
        - 'create content translations'
        - 'delete content translations'
        - 'update content translations'
        - 'administer tmgmt'
        - 'accept translation jobs'
        - 'create translation jobs'
        - 'submit translation jobs'
        - 'delete translation jobs'
        - 'translate any entity'
        - 'translate block_content'
        - 'translate editable entities'
        - 'translate interface'
        - 'translate menu_link_content'
        - 'translate tags taxonomy_term'
        - 'administer tmgmt'
        - 'manage ai translation prompts'
        - 'create ai content translation'
        - 'create ai interface translation'
