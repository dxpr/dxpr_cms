          <div class="az-section py-5 text-center" data-azb id=d8ywy1 style=background-image:url(-base-url-/-files-directory-/marketing-bg/try-dxpr-bg-pastel-blobs.png)><div class=container-fluid><div class="row align-items-start" data-azb id=Emxfvu><div class="col-6 col-12 col-md-12 py-5" data-azb id=K15g61><div class=az-icon data-azb data-dxpr-builder-libraries=icon_helpers id=Wzg1c1><i class="az-icon-content fa-lg"></i></div><div class="az-image py-5" data-azb id=y77nay><img alt="DXPR-logo" class=az-image-content src=-base-url-/-files-directory-/dxpr-logo.svg></div><div class="az-element az-text ck-content py-5" data-azb=az_text id=Omiqu1><h1 class="display-4 fw-bold mb-4">AI-natiivi Drupal<br>-sivunrakentaja on t&auml;&auml;ll&auml;</h1><p class="lead text-muted mb-5">Kuvaile mit&auml; haluat ja katso, kun DXPR AI<br>rakentaa rakenteella, parhailla k&auml;yt&auml;nn&ouml;ill&auml; ja tarkkuudella. </p></div></div></div></div></div><div class="az-section py-5 text-center" data-azb id=ts0uu7><div class=container><div class="row align-items-start" data-azb id=o86ac5><div class="col-6 col-2 col-md-2" data-azb id=d2mzlu></div><div class="col-6 col-8 col-md-8" data-azb id=u3z1hr><div class="az-element az-text ck-content py-5" data-azb=az_text id=nh04lq><h2>DXPR Builder 3 on Drupal-sivunrakennuksen t&auml;ydellinen uudelleenrakentaminen sis&auml;ll&ouml;ntuotannon seuraavalle aikakaudelle.</h2><p class="text-muted mb-5 lead">Katso, kun teko&auml;ly luo sivun. Hienosäädä jokainen osio visuaalisesti. Julkaise sitten Drupalin k&auml;ytt&ouml;oikeuksilla, versioilla, k&auml;&auml;nn&ouml;ksill&auml; ja ty&ouml;nkuluilla, joihin organisaatiosi jo luottaa.</p></div></div><div class="col-6 col-2 col-md-2" data-azb id=ukh488></div></div><div class="row g-4 align-items-start" data-azb id=Bp53dk><div class="col-6 col-md-4" data-azb id=Ijhvu8><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Ideasta sivuksi</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Luo kokonaisia sivuja, kirjoita osioita uudelleen, k&auml;&auml;nn&auml; sis&auml;lt&ouml;&auml;, luo kuvia ja rakenna uudelleenk&auml;ytett&auml;vi&auml; asetteluja ilman tyhj&auml;st&auml; aloittamista.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="DXPR Builder UI: AI-generointikehote" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Muokkaa luottavaisesti</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Uudelleensuunniteltu WCAG 2.2 AAA -keskittynyt k&auml;ytt&ouml;liittym&auml; antaa sis&auml;lt&ouml;tiimeille puhtaamman, nopeamman ja esteett&ouml;m&auml;mm&auml;n tavan rakentaa.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder UI: AI-keskustelu" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal pit&auml;&auml; ohjat k&auml;siss&auml;&auml;n</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Sis&auml;lt&ouml;si pysyy j&auml;senneltyn&auml;, siirrett&auml;v&auml;n&auml; ja Drupalin hallitsemana, puhtaalla Bootstrap 5 HTML:ll&auml; suljetun sivunrakentaja-merkinn&auml;n sijaan.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder UI: Paikallismuokkaus" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
