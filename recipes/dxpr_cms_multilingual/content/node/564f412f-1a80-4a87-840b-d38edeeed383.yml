_card id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>De l&rsquo;id&eacute;e &agrave; la page</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">G&eacute;n&eacute;rez des pages compl&egrave;tes, r&eacute;&eacute;crivez des sections, traduisez du contenu, cr&eacute;ez des images et concevez des mises en page r&eacute;utilisables sans repartir de z&eacute;ro.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="Interface DXPR Builder : Invite de g&eacute;n&eacute;ration IA" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>&Eacute;ditez en toute confiance</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Une interface repens&eacute;e ax&eacute;e sur WCAG 2.2 AAA offre aux &eacute;quipes de contenu une mani&egrave;re plus propre, plus rapide et plus accessible de construire.</p></div><div class=az-image data-azb id=upashw><img alt="Interface DXPR Builder : Chat IA" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal garde le contr&ocirc;le</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Votre contenu reste structur&eacute;, portable et gouvern&eacute; par Drupal, avec du HTML Bootstrap 5 propre au lieu d&rsquo;un balisage propri&eacute;taire.</p></div><div class=az-image data-azb id=Is9tnz><img alt="Interface DXPR Builder : &Eacute;dition en ligne" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
