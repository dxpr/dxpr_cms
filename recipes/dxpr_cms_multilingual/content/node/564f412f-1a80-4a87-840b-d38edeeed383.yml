az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Od n&aacute;padu ke str&aacute;nce</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Generujte kompletn&iacute; str&aacute;nky, přepi&scaron;te sekce, překl&aacute;dejte obsah, vytv&aacute;řejte obr&aacute;zky a stavějte opakovaně použiteln&eacute; rozložen&iacute; bez zač&iacute;n&aacute;n&iacute; na pr&aacute;zdn&eacute;m pl&aacute;tně.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="DXPR Builder UI: V&yacute;zva pro AI generov&aacute;n&iacute;" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Upravujte s jistotou</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Přepracovan&eacute; rozhran&iacute; zaměřen&eacute; na WCAG 2.2 AAA d&aacute;v&aacute; obsahov&yacute;m t&yacute;m&#x16F;m čist&scaron;&iacute;, rychlej&scaron;&iacute; a př&iacute;stupněj&scaron;&iacute; zp&#x16F;sob tvorby.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder UI: AI chat" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal si udržuje kontrolu</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">V&aacute;&scaron; obsah z&#x16F;st&aacute;v&aacute; strukturovan&yacute;, přenositeln&yacute; a ř&iacute;zen&yacute; Drupalem, s čist&yacute;m Bootstrap 5 HTML nam&iacute;sto propriet&aacute;rn&iacute;ho k&oacute;du page builder&#x16F;.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder UI: Inline &uacute;pravy" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
