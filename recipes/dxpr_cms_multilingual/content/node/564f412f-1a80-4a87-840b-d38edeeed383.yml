d id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>De la idea a la p&aacute;gina, as&iacute; de f&aacute;cil</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Genera p&aacute;ginas completas, reescribe secciones, traduce contenido, crea im&aacute;genes y arma dise&ntilde;os reutilizables sin partir de cero.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="Interfaz DXPR Builder: Prompt de generaci&oacute;n con IA" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Edita con toda confianza</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Una interfaz redise&ntilde;ada con foco en WCAG 2.2 AAA le da a los equipos de contenido una forma m&aacute;s limpia, r&aacute;pida y accesible de trabajar.</p></div><div class=az-image data-azb id=upashw><img alt="Interfaz DXPR Builder: Chat con IA" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal lleva las riendas</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Tu contenido queda estructurado, portable y gobernado por Drupal, con HTML limpio de Bootstrap 5 en vez de markup propietario.</p></div><div class=az-image data-azb id=Is9tnz><img alt="Interfaz DXPR Builder: Edici&oacute;n en l&iacute;nea" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
