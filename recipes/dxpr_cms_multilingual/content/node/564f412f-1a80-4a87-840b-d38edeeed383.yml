          <div class="az-section py-5 text-center" data-azb id=d8ywy1 style=background-image:url(-base-url-/-files-directory-/marketing-bg/try-dxpr-bg-pastel-blobs.png)><div class=container-fluid><div class="row align-items-start" data-azb id=Emxfvu><div class="col-6 col-12 col-md-12 py-5" data-azb id=K15g61><div class=az-icon data-azb data-dxpr-builder-libraries=icon_helpers id=Wzg1c1><i class="az-icon-content fa-lg"></i></div><div class="az-image py-5" data-azb id=y77nay><img alt="DXPR logosu" class=az-image-content src=-base-url-/-files-directory-/dxpr-logo.svg></div><div class="az-element az-text ck-content py-5" data-azb=az_text id=Omiqu1><h1 class="display-4 fw-bold mb-4">Yapay zek&acirc; odaklı Drupal<br>sayfa oluşturucu geldi</h1><p class="lead text-muted mb-5">Ne istediğinizi tanımlayın ve DXPR AI&rsquo;nin<br>yapı, en iyi uygulamalar ve hassasiyetle inşa ettiğini izleyin. </p></div></div></div></div></div><div class="az-section py-5 text-center" data-azb id=ts0uu7><div class=container><div class="row align-items-start" data-azb id=o86ac5><div class="col-6 col-2 col-md-2" data-azb id=d2mzlu></div><div class="col-6 col-8 col-md-8" data-azb id=u3z1hr><div class="az-element az-text ck-content py-5" data-azb=az_text id=nh04lq><h2>DXPR Builder 3, i&ccedil;erik oluşturmanın bir sonraki d&ouml;nemi i&ccedil;in Drupal sayfa oluşturmanın sıfırdan yeniden inşasıdır.</h2><p class="text-muted mb-5 lead">Yapay zek&acirc;nın sayfayı oluşturmasını izleyin. Her b&ouml;l&uuml;m&uuml; g&ouml;rsel olarak iyileştirin. Ardından, kuruluşunuzun zaten g&uuml;vendiği Drupal izinleri, revizyonları, &ccedil;evirileri ve iş akışlarıyla yayımlayın.</p></div></div><div class="col-6 col-2 col-md-2" data-azb id=ukh488></div></div><div class="row g-4 align-items-start" data-azb id=Bp53dk><div class="col-6 col-md-4" data-azb id=Ijhvu8><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Fikir geldi, sayfa hazır</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Eksiksiz sayfalar oluşturun, b&ouml;l&uuml;mleri yeniden yazın, i&ccedil;erik &ccedil;evirin, g&ouml;rseller oluşturun ve yeniden kullanılabilir d&uuml;zenler inşa edin; boş bir sayfadan başlamak zorunda kalmadan.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="DXPR Builder Aray&uuml;z&uuml;: Yapay Zek&acirc; &Uuml;retim İstemi" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>G&uuml;venle d&uuml;zenleyin</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">WCAG 2.2 AAA odaklı yeniden tasarlanmış bir aray&uuml;z, i&ccedil;erik ekiplerine daha temiz, daha hızlı ve daha erişilebilir bir oluşturma y&ouml;ntemi sunar.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder Aray&uuml;z&uuml;: Yapay Zek&acirc; Sohbet" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal kontrol&uuml; elinde tutar</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">İ&ccedil;eriğiniz yapılandırılmış, taşınabilir ve Drupal tarafından y&ouml;netilir; tescilli sayfa oluşturucu işaretlemesi yerine temiz Bootstrap 5 HTML ile.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder Aray&uuml;z&uuml;: Satır İ&ccedil;i D&uuml;zenleme" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
