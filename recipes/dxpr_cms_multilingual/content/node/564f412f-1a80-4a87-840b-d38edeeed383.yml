Van idee naar pagina, zo gepiept</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Genereer complete pagina's, herschrijf secties, vertaal content, maak afbeeldingen en bouw herbruikbare lay-outs zonder te beginnen met een leeg canvas.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="DXPR Builder UI: AI-generatieprompt" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Bewerk met vertrouwen</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Een vernieuwde interface gericht op WCAG 2.2 AAA biedt contentteams een cleanere, snellere en toegankelijkere manier om te bouwen.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder UI: AI-chat" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal houdt de controle</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Je content blijft gestructureerd, overdraagbaar en beheerd door Drupal, met cleane Bootstrap 5 HTML in plaats van eigen paginabouwer-opmaak.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder UI: Inline bewerken" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
