          <div class="az-section py-5 text-center" data-azb id=d8ywy1 style=background-image:url(-base-url-/-files-directory-/marketing-bg/try-dxpr-bg-pastel-blobs.png)><div class=container-fluid><div class="row align-items-start" data-azb id=Emxfvu><div class="col-6 col-12 col-md-12 py-5" data-azb id=K15g61><div class=az-icon data-azb data-dxpr-builder-libraries=icon_helpers id=Wzg1c1><i class="az-icon-content fa-lg"></i></div><div class="az-image py-5" data-azb id=y77nay><img alt="Log&oacute;tipo DXPR" class=az-image-content src=-base-url-/-files-directory-/dxpr-logo.svg></div><div class="az-element az-text ck-content py-5" data-azb=az_text id=Omiqu1><h1 class="display-4 fw-bold mb-4">O construtor de p&aacute;ginas Drupal<br>nativo de IA chegou</h1><p class="lead text-muted mb-5">Descreva o que pretende e veja a DXPR AI<br>construir com estrutura, boas pr&aacute;ticas e precis&atilde;o. </p></div></div></div></div></div><div class="az-section py-5 text-center" data-azb id=ts0uu7><div class=container><div class="row align-items-start" data-azb id=o86ac5><div class="col-6 col-2 col-md-2" data-azb id=d2mzlu></div><div class="col-6 col-8 col-md-8" data-azb id=u3z1hr><div class="az-element az-text ck-content py-5" data-azb=az_text id=nh04lq><h2>O DXPR Builder 3 &eacute; uma reconstru&ccedil;&atilde;o completa da cria&ccedil;&atilde;o de p&aacute;ginas Drupal para a pr&oacute;xima era da cria&ccedil;&atilde;o de conte&uacute;do.</h2><p class="text-muted mb-5 lead">Veja a IA gerar a p&aacute;gina. Refine cada sec&ccedil;&atilde;o visualmente. Depois publique com as permiss&otilde;es, revis&otilde;es, tradu&ccedil;&otilde;es e fluxos de trabalho do Drupal em que a sua organiza&ccedil;&atilde;o j&aacute; confia.</p></div></div><div class="col-6 col-2 col-md-2" data-azb id=ukh488></div></div><div class="row g-4 align-items-start" data-azb id=Bp53dk><div class="col-6 col-md-4" data-azb id=Ijhvu8><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Da ideia &agrave; p&aacute;gina</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Gere p&aacute;ginas completas, reescreva sec&ccedil;&otilde;es, traduza conte&uacute;do, crie imagens e construa layouts reutiliz&aacute;veis sem come&ccedil;ar do zero.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="Interface DXPR Builder: Prompt de gera&ccedil;&atilde;o IA" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Edite com confian&ccedil;a</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Uma interface redesenhada focada em WCAG 2.2 AAA oferece &agrave;s equipas de conte&uacute;do uma forma mais limpa, r&aacute;pida e acess&iacute;vel de construir.</p></div><div class=az-image data-azb id=upashw><img alt="Interface DXPR Builder: Chat IA" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>O Drupal mant&eacute;m o controlo</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">O seu conte&uacute;do permanece estruturado, port&aacute;vel e governado pelo Drupal, com HTML Bootstrap 5 limpo em vez de marca&ccedil;&atilde;o propriet&aacute;ria.</p></div><div class=az-image data-azb id=Is9tnz><img alt="Interface DXPR Builder: Edi&ccedil;&atilde;o em linha" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
