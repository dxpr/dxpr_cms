zcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Von der Idee zur Seite</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Erstellen Sie komplette Seiten, schreiben Sie Abschnitte um, &uuml;bersetzen Sie Inhalte, erstellen Sie Bilder und bauen Sie wiederverwendbare Layouts, ohne bei Null anfangen zu m&uuml;ssen.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="DXPR Builder UI: KI-Generierungsprompt" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Bearbeiten mit Zuversicht</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Eine neu gestaltete, auf WCAG 2.2 AAA ausgerichtete Oberfl&auml;che bietet Content-Teams eine sauberere, schnellere und barrierefreiere Art zu arbeiten.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder UI: KI-Chat" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal beh&auml;lt die Kontrolle</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Ihre Inhalte bleiben strukturiert, portabel und von Drupal verwaltet, mit sauberem Bootstrap 5 HTML anstelle von propriet&auml;rem Page-Builder-Markup.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder UI: Inline-Bearbeitung" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
