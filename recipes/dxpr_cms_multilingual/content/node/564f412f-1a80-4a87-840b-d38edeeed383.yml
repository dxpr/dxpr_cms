ext id=Npzbyt><p class="text-muted small">WCAG 2.2 AAA&#xC5D0; &#xCD08;&#xC810;&#xC744; &#xB9DE;&#xCD98; &#xC7AC;&#xC124;&#xACC4;&#xB41C; &#xC778;&#xD130;&#xD398;&#xC774;&#xC2A4;&#xAC00; &#xCF58;&#xD150;&#xCE20; &#xD300;&#xC5D0;&#xAC8C; &#xB354; &#xAE68;&#xB057;&#xD558;&#xACE0; &#xBE60;&#xB974;&#xBA70; &#xC811;&#xADFC;&#xC131; &#xB192;&#xC740; &#xAD6C;&#xCD95; &#xBC29;&#xBC95;&#xC744; &#xC81C;&#xACF5;&#xD569;&#xB2C8;&#xB2E4;.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder UI: AI &#xCC44;&#xD305;" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal&#xC774; &#xC81C;&#xC5B4;&#xAD8C;&#xC744; &#xC720;&#xC9C0;</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">&#xCF58;&#xD150;&#xCE20;&#xB294; &#xAD6C;&#xC870;&#xD654;&#xB418;&#xACE0; &#xC774;&#xC2DD; &#xAC00;&#xB2A5;&#xD558;&#xBA70; Drupal&#xC774; &#xAD00;&#xB9AC;&#xD569;&#xB2C8;&#xB2E4;. &#xB3C5;&#xC810; &#xD398;&#xC774;&#xC9C0; &#xBE4C;&#xB354; &#xB9C8;&#xD06C;&#xC5C5; &#xB300;&#xC2E0; &#xAE68;&#xB057;&#xD55C; Bootstrap 5 HTML&#xC744; &#xC0AC;&#xC6A9;&#xD569;&#xB2C8;&#xB2E4;.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder UI: &#xC778;&#xB77C;&#xC778; &#xD3B8;&#xC9D1;" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
