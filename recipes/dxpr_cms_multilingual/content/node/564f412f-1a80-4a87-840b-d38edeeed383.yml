          <div class="az-section py-5 text-center" data-azb id=d8ywy1 style=background-image:url(-base-url-/-files-directory-/marketing-bg/try-dxpr-bg-pastel-blobs.png)><div class=container-fluid><div class="row align-items-start" data-azb id=Emxfvu><div class="col-6 col-12 col-md-12 py-5" data-azb id=K15g61><div class=az-icon data-azb data-dxpr-builder-libraries=icon_helpers id=Wzg1c1><i class="az-icon-content fa-lg"></i></div><div class="az-image py-5" data-azb id=y77nay><img alt="Logo DXPR" class=az-image-content src=-base-url-/-files-directory-/dxpr-logo.svg></div><div class="az-element az-text ck-content py-5" data-azb=az_text id=Omiqu1><h1 class="display-4 fw-bold mb-4">Pembuat halaman Drupal<br>berbasis AI telah hadir</h1><p class="lead text-muted mb-5">Jelaskan apa yang Anda inginkan, dan saksikan DXPR AI<br>membangun dengan struktur, praktik terbaik, dan presisi. </p></div></div></div></div></div><div class="az-section py-5 text-center" data-azb id=ts0uu7><div class=container><div class="row align-items-start" data-azb id=o86ac5><div class="col-6 col-2 col-md-2" data-azb id=d2mzlu></div><div class="col-6 col-8 col-md-8" data-azb id=u3z1hr><div class="az-element az-text ck-content py-5" data-azb=az_text id=nh04lq><h2>DXPR Builder 3 adalah pembangunan ulang total pembuatan halaman Drupal untuk era berikutnya dalam pembuatan konten.</h2><p class="text-muted mb-5 lead">Saksikan AI membuat halaman. Sempurnakan setiap bagian secara visual. Kemudian terbitkan dengan izin, revisi, terjemahan, dan alur kerja Drupal yang sudah dipercaya organisasi Anda.</p></div></div><div class="col-6 col-2 col-md-2" data-azb id=ukh488></div></div><div class="row g-4 align-items-start" data-azb id=Bp53dk><div class="col-6 col-md-4" data-azb id=Ijhvu8><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Dari ide ke halaman</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Buat halaman lengkap, tulis ulang bagian, terjemahkan konten, buat gambar, dan bangun tata letak yang dapat digunakan kembali tanpa memulai dari nol.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="Antarmuka DXPR Builder: Prompt Pembuatan AI" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Edit dengan percaya diri</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Antarmuka yang didesain ulang dengan fokus WCAG 2.2 AAA memberikan tim konten cara yang lebih bersih, lebih cepat, dan lebih mudah diakses untuk membangun.</p></div><div class=az-image data-azb id=upashw><img alt="Antarmuka DXPR Builder: Chat AI" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal tetap memegang kendali</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Konten Anda tetap terstruktur, portabel, dan dikelola oleh Drupal, dengan HTML Bootstrap 5 yang bersih alih-alih markup pembuat halaman proprietary.</p></div><div class=az-image data-azb id=Is9tnz><img alt="Antarmuka DXPR Builder: Penyuntingan Inline" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
