          <div class="az-section py-5 text-center" data-azb id=d8ywy1 style=background-image:url(-base-url-/-files-directory-/marketing-bg/try-dxpr-bg-pastel-blobs.png)><div class=container-fluid><div class="row align-items-start" data-azb id=Emxfvu><div class="col-6 col-12 col-md-12 py-5" data-azb id=K15g61><div class=az-icon data-azb data-dxpr-builder-libraries=icon_helpers id=Wzg1c1><i class="az-icon-content fa-lg"></i></div><div class="az-image py-5" data-azb id=y77nay><img alt="DXPR-logo" class=az-image-content src=-base-url-/-files-directory-/dxpr-logo.svg></div><div class="az-element az-text ck-content py-5" data-azb=az_text id=Omiqu1><h1 class="display-4 fw-bold mb-4">Den AI-native Drupal<br>sidebyggeren er her</h1><p class="lead text-muted mb-5">Beskriv hva du &oslash;nsker, og se DXPR AI<br>bygge med struktur, beste praksis og presisjon. </p></div></div></div></div></div><div class="az-section py-5 text-center" data-azb id=ts0uu7><div class=container><div class="row align-items-start" data-azb id=o86ac5><div class="col-6 col-2 col-md-2" data-azb id=d2mzlu></div><div class="col-6 col-8 col-md-8" data-azb id=u3z1hr><div class="az-element az-text ck-content py-5" data-azb=az_text id=nh04lq><h2>DXPR Builder 3 er en fullstendig nybygging av Drupal-sidebygging for neste &aelig;ra av innholdsproduksjon.</h2><p class="text-muted mb-5 lead">Se AI generere siden. Finjuster hver seksjon visuelt. Publiser deretter med Drupal-tillatelsene, revisjonene, oversettelsene og arbeidsflytene som organisasjonen din allerede stoler p&aring;.</p></div></div><div class="col-6 col-2 col-md-2" data-azb id=ukh488></div></div><div class="row g-4 align-items-start" data-azb id=Bp53dk><div class="col-6 col-md-4" data-azb id=Ijhvu8><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Fra id&eacute; til side</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Generer komplette sider, skriv om seksjoner, oversett innhold, lag bilder og bygg gjenbrukbare oppsett uten &aring; starte fra blanke ark.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="DXPR Builder UI: AI-genereringsprompt" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Rediger med trygghet</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">Et redesignet WCAG 2.2 AAA-fokusert grensesnitt gir innholdsteam en renere, raskere og mer tilgjengelig m&aring;te &aring; bygge p&aring;.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder UI: AI-chat" src=-base-url-/-files-directory-/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Drupal beholder kontrollen</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Innholdet ditt forblir strukturert, portabelt og styrt av Drupal, med ren Bootstrap 5 HTML i stedet for propriet&aelig;r sidebygger-kode.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder UI: Inline-redigering" class=az-image-content src=-base-url-/-files-directory-/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
