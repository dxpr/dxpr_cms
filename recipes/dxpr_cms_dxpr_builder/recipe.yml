name: 'DXPR Builder'
description: 'DXPR Builder visual layout builder.'
type: 'Builder'
recipes:
  - dxpr_cms_page
  - core/recipes/full_html_format_editor
  - dxpr_cms_roles
install:
  - block_content
  - contact_block
  - options
  - field_group
  - menu_link_attributes
  - node
  - workflows
  - dxpr_builder
  - dxpr_builder_block
  - dxpr_theme_helper
  - ace_editor
config:
  strict: false
  import:
    contact_block: '*'
    dxpr_builder: '*'
    dxpr_builder_block: '*'
    dxpr_theme_helper: '*'
    menu_link_attributes: '*'
  actions:
    system.site:
      simple_config_update:
        name: 'DXPR CMS'
        page.front: '/home'
    user.role.content_administrator:
      grantPermissions:
        - 'edit with dxpr builder'
        - 'use text format dxpr_builder_html'
    user.role.site_builder:
      grantPermissions:
        - 'edit with dxpr builder'
        - 'administer dxpr_builder_profile'
        - 'administer workflows'
        - 'use text format dxpr_builder_html'
    user.role.content_editor:
      grantPermissions:
        - 'edit with dxpr builder'
        - 'use text format dxpr_builder_html'
