        <div class="az-section py-5 text-center" data-azb id=d8ywy1 style=background-image:url(-base-url-/sites/default/files/marketing-bg/try-dxpr-bg-pastel-blobs.png)><div class=container-fluid><div class="row align-items-start" data-azb id=Emxfvu><div class="col-6 col-12 col-md-12 py-5" data-azb id=K15g61><div class=az-icon data-azb data-dxpr-builder-libraries=icon_helpers id=Wzg1c1><i class="az-icon-content fa-lg"></i></div><div class="az-image py-5" data-azb id=y77nay><img alt="DXPR logo" class=az-image-content src=-base-url-/sites/default/files/dxpr-logo.svg></div><div class="az-element az-text ck-content py-5" data-azb=az_text id=Omiqu1><h1 class="display-4 fw-bold mb-4">The AI-native Drupal<br>page builder has arrived</h1><p class="lead text-muted mb-5">Describe what you want, and watch DXPR AI<br>build with structure, best practices, and precision. </p></div></div></div></div></div><div class="az-section py-5 text-center" data-azb id=ts0uu7><div class=container><div class="row align-items-start" data-azb id=o86ac5><div class="col-6 col-2 col-md-2" data-azb id=d2mzlu></div><div class="col-6 col-8 col-md-8" data-azb id=u3z1hr><div class="az-element az-text ck-content py-5" data-azb=az_text id=nh04lq><h2>DXPR Builder 3 is a ground-up rebuild of Drupal page building for the next era of content creation.</h2><p class="text-muted mb-5 lead">Watch AI generate the page. Refine every section visually. Then publish with the Drupal permissions, revisions, translations, and workflows your organization already trusts.</p></div></div><div class="col-6 col-2 col-md-2" data-azb id=ukh488></div></div><div class="row g-4 align-items-start" data-azb id=Bp53dk><div class="col-6 col-md-4" data-azb id=Ijhvu8><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Dtwlom><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=Zjpywu><h4 class=fw-bold>Go from idea to page</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Azakbi><p class="text-muted small">Generate complete pages, rewrite sections, translate content, create images, and build reusable layouts without starting from a blank canvas.</p></div><div class=az-image data-azb id=Wlg5c9><img alt="DXPR Builder UI: AI Generate Prompt" src=-base-url-/sites/default/files/dxpr-builder-ui-ai-generate.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Lyz1gn><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=Cm1s1e><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=V651ku><h4 class=fw-bold>Edit with confidence</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Npzbyt><p class="text-muted small">A redesigned WCAG 2.2 AAA-focused interface gives content teams a cleaner, faster, more accessible way to build.</p></div><div class=az-image data-azb id=upashw><img alt="DXPR Builder UI: AI Chat" src=-base-url-/sites/default/files/dxpr-builder-ui-ai-chat.png class=az-image-content></div></div></div></div></div><div class="col-6 col-md-4" data-azb id=Th6bej><div class="az-element az-card card border-0 shadow-sm rounded-4 p-4 h-100 text-start" data-azb=az_card id=gmpclm><div class=card-body><div class=az-ctnr data-azcnt=true><div class="az-element az-text ck-content mb-3" data-azb=az_text id=e5oexo><h4 class=fw-bold>Keep Drupal in control</h4></div><div class="az-element az-text ck-content" data-azb=az_text id=Lw3suq><p class="text-muted small">Your content stays structured, portable, and governed by Drupal, with clean Bootstrap 5 HTML instead of proprietary page-builder markup.</p></div><div class=az-image data-azb id=Is9tnz><img alt="DXPR Builder UI: Inline Editing" class=az-image-content src=-base-url-/sites/default/files/dxpr-builder-ui-inline-editing.png></div></div></div></div></div></div></div></div>
      format: dxpr_builder_html
