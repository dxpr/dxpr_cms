        <div class="container-fluid py-5 text-center">
        <div class="row">
        <div class="col-12 col-md-8 py-5 mx-auto">
        <h1 class="display-4 fw-bold mb-4">About DXPR</h1>
        <p class="lead text-muted mb-5">Open-source tools for building better Drupal websites.</p>
        </div>
        </div>
        </div>

        <div class="container py-5">
        <div class="row">
        <div class="col-12 col-md-8 mx-auto">
        <h2 class="fw-bold mb-4">What we do</h2>
        <p class="mb-4">DXPR builds open-source products for the Drupal ecosystem. Our focus is on making Drupal more accessible to content teams without compromising the architectural strengths that developers rely on.</p>
        <p class="mb-4">Our flagship products are DXPR Builder, a visual page builder with AI-powered content generation, and DXPR Theme, a Bootstrap-based Drupal theme with extensive customisation options. Together they provide a complete front-end solution for Drupal sites.</p>
        </div>
        </div>
        </div>

        <div class="container py-5">
        <div class="row g-4">
        <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
        <div class="card-body">
        <h4 class="fw-bold">DXPR Builder</h4>
        <p class="text-muted small">A visual page builder for Drupal with AI generation, drag-and-drop editing, and clean Bootstrap 5 output. Designed for content teams who need creative freedom within structured governance.</p>
        </div>
        </div>
        </div>
        <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
        <div class="card-body">
        <h4 class="fw-bold">DXPR Theme</h4>
        <p class="text-muted small">A Bootstrap 5 theme for Drupal with 100+ configuration options. Typography, colours, layout, and branding can all be adjusted through the admin interface without writing CSS.</p>
        </div>
        </div>
        </div>
        <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
        <div class="card-body">
        <h4 class="fw-bold">DXPR CMS</h4>
        <p class="text-muted small">A Drupal distribution that bundles DXPR Builder, DXPR Theme, and curated contributed modules into a ready-to-use CMS. Install once and start building immediately.</p>
        </div>
        </div>
        </div>
        </div>
        </div>

        <div class="container py-5">
        <div class="row">
        <div class="col-12 col-md-8 mx-auto">
        <h2 class="fw-bold mb-4">Open source</h2>
        <p class="mb-4">All DXPR products are open source and available on Drupal.org and GitHub. We believe the best way to build sustainable software is to develop it in the open, with contributions from the community and transparency in how decisions are made.</p>
        <p class="mb-4">DXPR Builder is actively maintained with regular releases, automated testing, and a public issue queue. Contributions are welcome; see our <a href="https://github.com/dxpr/dxpr_builder">GitHub repository</a> for contributing guidelines.</p>
        </div>
        </div>
        </div>
      format: dxpr_builder_html
