  field_content:
    -
      value: "<p>The our CMS Security Team has released critical security updates addressing several vulnerabilities discovered in recent versions. All site administrators are strongly encouraged to update their installations immediately.</p><h2>Security Advisory Details</h2><p>This release addresses multiple vulnerabilities including potential cross-site scripting (XSS) vectors and access bypass issues, ranging from moderately to highly critical. Updates are available for all supported our CMS versions; sites running older versions should prioritize updating.</p><h2>Update Process</h2><p>Updates can be applied through Composer. The security team recommends testing in staging environments before applying to production. Administrators using contributed modules should also check for corresponding security updates to ensure all components are secure.</p>"
