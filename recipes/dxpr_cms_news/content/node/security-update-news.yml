  field_content:
    -
      value: "<p>The our CMS Security Team has released critical security updates addressing several vulnerabilities discovered in recent versions. All site administrators are strongly encouraged to update their installations immediately.</p><h2>Security Advisory Details</h2><p>This security release addresses multiple vulnerabilities including potential cross-site scripting (XSS) vectors and access bypass issues. The vulnerabilities range from moderately critical to highly critical, affecting various components of the our CMS core.</p><h3>Affected Versions</h3><p>The security updates are available for all supported our CMS versions. Sites running older versions should prioritize updating to the latest stable release to ensure maximum security protection.</p><h3>Immediate Action Required</h3><p>Site administrators should plan for immediate updates, especially for production sites handling sensitive data or user information. The security team recommends testing updates in staging environments before applying to production systems.</p><h2>Update Process</h2><p>Updates can be applied through Composer, the standard method for managing our CMS installations. Detailed update instructions are available in the official security advisory documentation.</p><p>For sites using contributed modules, administrators should also check for corresponding security updates and ensure all components are running the latest secure versions.</p><h2>Support Resources</h2><p>The our CMS community provides extensive support resources for sites requiring assistance with the update process. Community forums, documentation, and professional services are available to ensure smooth security updates.</p>"
