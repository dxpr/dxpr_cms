name: News
type: DXPR CMS
description: Adds a news content type and listing page.
recipes:
  - dxpr_cms_page
  - dxpr_cms_dxpr_theme
  - core/recipes/content_editor_role
install:
  - block_content
  - add_content_by_bundle
  - dxpr_theme_helper
  - menu_link_content
  - selective_better_exposed_filters
  - smart_trim
  - views_bootstrap
config:
  strict: false
  import:
    dxpr_theme_helper: '*'
    system:
      - system.menu.main
  actions:
    user.role.content_editor:
      grantPermissions: []
    user.role.content_administrator:
      grantPermissions: []

    user.role.site_builder:
      grantPermissions: []
    workflows.workflow.basic_editorial:
      addNodeTypes: ['news']

    # Configure news block placements
    block.block.dxpr_theme_newsroom:
      simple_config_update:
        status: true
        region: highlighted
        weight: -7
    
    block.block.dxpr_theme_mediakit:
      simple_config_update:
        status: true
        region: content_bottom
        weight: 0
