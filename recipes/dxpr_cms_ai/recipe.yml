name: AI Assistant
type: DXPR CMS
description: Adds integration with AI services, such as alt text generation and content analysis. Requires a DXPR API key.
install:
  - key
  - block
  - taxonomy
  - ai
  - ai_provider_dxpr
  - ai_image_alt_text
  - ai_agents
  - ai_checklist
  - ai_social_posts
  - ai_content_strategy
  - analyze_ai_brand_voice
  - analyze_ai_sentiment
  - analyze_ai_content_marketing_audit
  - analyze_ai_content_security_audit
  - analyze_basic_content_info
  - analyze_page_views
  - ai_sorting
  - analyze
  - rl
  - ckeditor_ai_agent
  - menu_link_content
  - markdownify
  - markdownify_path
  - diff
recipes:
  - core/recipes/content_editor_role
  - dxpr_cms_privacy_basic
  - dxpr_cms_roles
input:
  dxpr_api_key:
    data_type: string
    description: The DXPR API key for AI services.
    prompt:
      method: ask
      arguments:
        question: 'Enter your DXPR API key (get yours free at https://dxpr.com/user/free-registration):'
    form:
      '#type': 'textfield'
      '#description': 'Sign up free at <a href="https://dxpr.com/user/free-registration" target="_blank">DXPR.com</a> (takes 30 seconds) and grab your key from the <a href="https://app.dxpr.com/getting-started" target="_blank">Get Started dashboard</a>. Unlock enterprise-grade AI access included with your free account.'
      '#title': 'DXPR API Key'
      '#required': true
      '#maxlength': 2048
      '#attributes':
        autocomplete: 'off'
    default:
      source: value
      value: ''
config:
  import:
    ai_image_alt_text: '*'
    ai_agents: '*'
    ai_content_strategy: '*'
    ai_checklist: '*'
    ai_social_posts: '*'
  actions:
    ai_agents.settings:
      simpleConfigUpdate:
        agent_settings:
          field_type_agent:
            usage_instructions: >
              Changes to field groups, like moving fields into details, tabs or fieldsets, can not be done by the field agent. Always advice the user how to do this manually.

              If they ask you to change an edit form, assume they want you to change the fields on a content type if they are visiting a node form.

              If they ask to create an Image Field, assume they want an Media Field with the image bundle, unless they tell you not to create a media field. Specifically ask for an Entity Reference Field with Entity Type media and the bundle image. Always set the form widget to Media Library if its available and the view mode to Rendered Entity.

              If they ask to create a taxonomy field, make sure that you ask for select list on the form view.
            permissions:
              authenticated: 0
              content_editor: 0
              administrator: 0
            plugin_settings: {}
    ai_provider_dxpr.settings:
      setupAiProvider:
        key_value: ${dxpr_api_key}
        key_name: dxpr_api_key
        key_label: 'DXPR API Key'
        env_var: dxpr_api_key
        provider: dxpr
    klaro.klaro_app.ai_alt_text_generation:
      enable: []
    # Grant permissions to roles.
    user.role.content_editor:
      grantPermissions:
        - 'generate ai alt tags'
        - 'access ai content strategy'
        - 'view analyze reports'
        - 'view rl reports'
        - 'add ai_social_post entity'
        - 'view ai_social_post entity'
        - 'edit ai_social_post entity'
    user.role.content_administrator:
      grantPermissions:
        - 'access ai content strategy'
        - 'view analyze reports'
        - 'view rl reports'
        - 'generate ai alt tags'
        - 'add ai_social_post entity'
        - 'view ai_social_post entity'
        - 'edit ai_social_post entity'
        - 'delete ai_social_post entity'
    user.role.site_builder:
      grantPermissions:
        - 'access ai content strategy'
        - 'view analyze reports'
        - 'view rl reports'
        - 'administer analyze'
        - 'administer ckeditor ai agent'
        # Markdownify related setup.
        - 'administer markdownify'
        - 'generate ai alt tags'
        - 'add ai_social_post entity'
        - 'view ai_social_post entity'
        - 'edit ai_social_post entity'
        - 'delete ai_social_post entity'
        - 'administer ai_social_post entity'
    # Markdownify related setup.
    markdownify.settings:
      simpleConfigUpdate:
        supported_entity_types:
          - node
