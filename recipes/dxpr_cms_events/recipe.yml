name: Events
description: Adds an event content type and listing page.
type: DXPR CMS
recipes:
  - core/recipes/content_editor_role
  - core/recipes/document_media_type
  - dxpr_cms_page
  - dxpr_cms_privacy_basic
install:
  - add_content_by_bundle
  - address
  - addtocal_augment
  - date_augmenter
  - dxpr_theme_helper
  - geofield
  - geocoder
  - geocoder_address
  - geocoder_geofield
  - leaflet_views
  - menu_link_content
  - smart_date
config:
  # Treat all field storages strictly, since they influence the database layout.
  strict:
    - field.storage.node.field_date
    - field.storage.node.field_file
    - field.storage.node.field_geofield
    - field.storage.node.field_link
    - field.storage.node.field_location_address
  import:
    dxpr_theme_helper: '*'
    geofield: '*'
    smart_date: '*'
    system:
      - system.menu.main
  actions:
    user.role.content_editor:
      grantPermissions: []
    user.role.content_administrator:
      grantPermissions: []

    user.role.site_builder:
      grantPermissions: []
    workflows.workflow.basic_editorial:
      addNodeTypes: ['event']
    klaro.klaro_app.leaflet:
      enable: []
