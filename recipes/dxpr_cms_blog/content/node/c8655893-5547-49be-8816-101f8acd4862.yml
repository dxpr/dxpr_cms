  field_content:
    -
      value: '<div class="container py-5"><div class="row"><div class="col-12 col-md-12"><p>Every page builder has to choose a markup format. Some invent their own; others use a proprietary JSON structure that renders to HTML at display time. DXPR Builder 3 writes Bootstrap 5 HTML directly. This is a deliberate decision with far-reaching consequences.</p><p>Bootstrap is the most widely adopted CSS framework in the world. Developers know it. Designers know it. The documentation is thorough, the community is enormous, and the grid system handles responsive layout without custom CSS. When DXPR Builder generates a three-column feature section, the output is <code>div.row</code> with three <code>div.col-md-4</code> children. Any front-end developer can read, understand, and extend that markup.</p><p>This also means your content is portable. Export a DXPR Builder page and you get valid HTML that works in any Bootstrap 5 theme. There is no extraction step, no conversion tool, no data migration. The content <em>is</em> the markup. If you switch themes, the grid still works. If you move to a different CMS, the HTML still renders.</p><p>For the AI generation feature, Bootstrap 5 is an ideal target. Large language models have seen millions of Bootstrap examples during training. They understand the grid system, the utility classes, the component patterns. When we ask the AI to generate a pricing table or a hero section, it produces idiomatic Bootstrap that the builder can parse into editable components. A proprietary format would require fine-tuning and produce more errors.</p><p>The trade-off is that Bootstrap is opinionated. You get its spacing scale, its breakpoints, its class naming. For most websites this is a benefit: consistent, predictable, well-documented defaults. For highly custom designs, the builder supports additional CSS classes on any element, so you can always extend beyond Bootstrap when needed.</p></div></div></div>'
