  field_content:
    -
      value: '<div class="container py-5"><div class="row"><div class="col-12 col-md-12"><p>The fastest page is one you do not have to build from scratch. DXPR Builder''s template system lets you save any section, layout, or complete page as a reusable template that anyone on your team can drop into new content.</p><p>Templates work at two levels. Page templates are complete page layouts: a homepage structure, a service page with hero and feature sections, an event announcement with date and location blocks. Section templates are individual components: a hero banner, a three-column feature grid, a testimonial carousel, a call-to-action strip. You can combine section templates freely to assemble new pages without starting from a blank canvas.</p><p>The workflow is straightforward. Build a section you like, either manually or with AI assistance. Click save as template, give it a name, and it appears in the template library. When a colleague creates a new page, they browse the library, pick the sections they need, and customise the content. The structure stays consistent; only the text and images change.</p><p>This solves a real problem in organisations with multiple content creators. Without templates, each person invents their own layout, and the site gradually loses visual coherence. With templates, the design team defines the approved patterns once, and everyone else works within those patterns. It is design governance without gatekeeping.</p><p>Templates are stored as standard DXPR Builder markup, so they are versionable, exportable, and portable between sites. If you manage multiple Drupal sites, you can maintain a shared template library and deploy it across all of them. When the design evolves, update the template; new pages pick up the change automatically.</p></div></div></div>'
