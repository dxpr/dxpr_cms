  field_content:
    -
      value: '<div class="container py-5"><div class="row"><div class="col-12 col-md-12"><p>Accessibility in page builders is usually an afterthought: a plugin that scans your finished page for contrast issues, or a checklist you run before publishing. DXPR Builder 3 takes a different approach. We redesigned the editor interface itself to meet WCAG 2.2 AAA standards, so accessibility is built into the tool, not bolted on afterwards.</p><p>This starts with the editor controls. Every button, panel, and dialogue in the builder meets AAA contrast ratios. Keyboard navigation works throughout: you can create a page, rearrange sections, edit text, and publish without ever touching a mouse. Focus indicators are clearly visible, and screen reader announcements describe what each action does.</p><p>The content the builder produces is accessible by default as well. Heading hierarchy is enforced: if you skip from H2 to H4, the builder flags it. Images require alt text before you can save. The Bootstrap 5 grid system ensures semantic HTML structure, so assistive technologies can parse the page correctly.</p><p>For organisations in regulated sectors (government, healthcare, education), this matters enormously. Accessibility compliance is not optional; it is a legal requirement in many jurisdictions. A page builder that produces inaccessible output creates liability. DXPR Builder reduces that risk by making the accessible choice the default choice.</p><p>We also run automated accessibility testing as part of our CI pipeline. Every pull request is checked against axe-core rules, and regressions block the merge. This means the accessibility standard does not degrade over time as new features are added. It is a continuous commitment, not a one-off audit.</p></div></div></div>'
