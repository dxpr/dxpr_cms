  field_content:
    -
      value: '<div class="container py-5"><div class="row"><div class="col-12 col-md-12"><p>Drupal developers have historically been sceptical of visual page builders, and for good reason. Most builders compromise the things that make Drupal valuable: structured content, granular permissions, revision history, multilingual workflows, and clean, portable markup. You gain visual editing but lose the architecture.</p><p>DXPR Builder was designed specifically for Drupal, not ported from another platform. It stores content in standard Drupal fields using a text format, which means all of Drupal''s content infrastructure works exactly as expected. Revisions track every change. Content moderation workflows (draft, review, published) apply to builder pages the same way they apply to any other content. Translations work through Drupal''s translation system.</p><p>Permissions are equally preserved. A content editor can build pages without having access to the theme layer, module configuration, or site administration. The builder respects Drupal''s role-based access control, so you can give marketing teams the freedom to create landing pages without opening up the keys to the entire site.</p><p>For developers, the output is inspectable and predictable. Open the page source and you see Bootstrap 5 HTML with semantic class names. There is no JavaScript rendering layer that hides the content from search engines or breaks when a library updates. The markup is the content; Drupal stores it, serves it, and caches it like any other field value.</p><p>This is what"without losing control" means in practice. You get the speed and accessibility of visual editing, layered on top of the content governance that made you choose Drupal in the first place. The builder does not replace Drupal''s architecture; it works within it.</p></div></div></div>'
      format: dxpr_builder_html
