name: Basic page
type: DXPR CMS
description: Adds a content type for simple pages.
recipes:
  - core/recipes/content_editor_role
  - dxpr_cms_content_type_base
config:
  strict: false
  actions:
    core.entity_view_display.node.page.default:
      enableLayoutBuilder: {  }
      allowLayoutOverrides: true
    user.role.content_editor:
      grantPermissions:
        - 'create page content'
        - 'delete page revisions'
        - 'delete own page content'
        - 'edit own page content'
        - 'view page revisions'
        - 'revert page revisions'
    user.role.content_administrator:
      grantPermissions:
        - 'create page content'
        - 'delete page revisions'
        - 'delete any page content'
        - 'edit any page content'
        - 'view page revisions'
        - 'revert page revisions'
    user.role.marketer:
      grantPermissions:
        - 'create page content'
        - 'delete page revisions'
        - 'delete own page content'
        - 'edit own page content'
        - 'view page revisions'
        - 'revert page revisions'
    user.role.site_builder:
      grantPermissions:
        - 'create page content'
        - 'delete page revisions'
        - 'delete any page content'
        - 'edit any page content'
        - 'view page revisions'
        - 'revert page revisions'
    workflows.workflow.basic_editorial:
      addNodeTypes: ['page']
