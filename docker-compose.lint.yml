services:

  drupal-lint:
    image: composer:2.7
    profiles: ["lint"]
    working_dir: /src
    command: bash -c "./scripts/run-drupal-lint.sh"
    environment:
      TARGET_DRUPAL_CORE_VERSION: 11
    volumes:
      - .:/src

  drupal-lint-auto-fix:
    image: composer:2.7
    profiles: ["lint"]
    working_dir: /src
    command: bash -c "./scripts/run-drupal-lint-auto-fix.sh"
    environment:
      TARGET_DRUPAL_CORE_VERSION: 11
    volumes:
      - .:/src
