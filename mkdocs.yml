site_name: DXPR CMS Documentation
repo_url: https://github.com/dxpr/dxpr_cms
repo_name: dxpr/dxpr_cms
edit_uri: -/tree/1.x/docs/
theme:
  name: material
  font:
    code: Roboto Mono
  palette:
    - scheme: default
      primary: indigo
      accent: deep-orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep-orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - header.autohide
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - attr_list
  - admonition
  - codehilite
  - tables
  - footnotes
  - def_list
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dxpr
    - icon: fontawesome/brands/linkedin
      link: https://nl.linkedin.com/company/dxpr
    - icon: fontawesome/brands/drupal
      link: https://www.drupal.org/node/2303425
nav:
  - Home: index.md
  - Modules:
      - Overview: modules.md
  - Kitchen Sink Demo: kitchen-sink.md
docs_dir: docs
site_dir: site
