site_name: DXPR CMS Documentation
repo_url: https://github.com/dxpr/dxpr_cms
repo_name: dxpr/dxpr_cms
edit_uri: -/tree/1.x/docs/
theme:
  name: material
  font:
    code: Roboto Mono
  palette:
    - scheme: default
      primary: indigo
      accent: deep-orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep-orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - header.autohide
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - mike:
      alias_type: redirect
      canonical_version: 1.0.0
      version_selector: true
      deploy_prefix: "mkdocs"
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.blocks.caption
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - footnotes
  - def_list
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dxpr
    - icon: fontawesome/brands/linkedin
      link: https://nl.linkedin.com/company/dxpr
    - icon: fontawesome/brands/drupal
      link: https://www.drupal.org/dxpr
  version:
    provider: mike
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
nav:
  - Home: index.md
  - Kitchen Sink Demo: kitchen-sink.md
docs_dir: docs
site_dir: site