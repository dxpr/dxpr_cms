# GitLab CI configuration for DXPR CMS
# Includes GitLab Pages deployment for MkDocs documentation

stages:
  - test
  - build
  - deploy

variables:
  # Docker image versions
  PHP_VERSION: "8.1"
  NODE_VERSION: "18"

# Template for PHP jobs
.php_template:
  image: php:${PHP_VERSION}-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

# GitLab Pages job for MkDocs documentation
pages:
  stage: deploy
  image: python:3.11-alpine
  rules:
    # Skip on tags
    - if: '$CI_COMMIT_TAG'
      when: never
    # Only run on default branch when docs change
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - mkdocs.yml
        - .gitlab-ci.yml
      when: on_success
    # Manual trigger for other branches
    - if: '$CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache git
    - pip install --no-cache-dir \
        mkdocs \
        mkdocs-material \
        mkdocs-glightbox \
        mike \
        pymdown-extensions \
        mkdocs-material-extensions
  script:
    - echo "Building documentation for DXPR CMS"
    - echo "Project URL will be $CI_PAGES_URL"

    # Build the documentation
    - mkdocs build --site-dir public --strict --verbose

    # Create a simple 404 page
    - |
      cat > public/404.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
          <title>404 - Page Not Found</title>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
              body { font-family: system-ui, sans-serif; text-align: center; padding: 50px; }
              h1 { color: #4051b5; }
              a { color: #4051b5; text-decoration: none; }
              a:hover { text-decoration: underline; }
          </style>
      </head>
      <body>
          <h1>404 - Page Not Found</h1>
          <p>The page you're looking for doesn't exist.</p>
          <p><a href="/">← Back to Documentation</a></p>
      </body>
      </html>
      EOF

    # Add GitLab Pages specific files
    - echo "Documentation build complete"
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  environment:
    name: production
    url: $CI_PAGES_URL

# Optional: Test job for documentation
test:docs:
  stage: test
  image: python:3.11-alpine
  rules:
    - changes:
        - docs/**/*
        - mkdocs.yml
  before_script:
    - pip install --no-cache-dir mkdocs mkdocs-material
  script:
    - echo "Testing documentation build"
    - mkdocs build --strict --site-dir test_site
    - echo "Documentation test successful"
  artifacts:
    paths:
      - test_site
    expire_in: 1 day

# PHP CodeSniffer
phpcs:
  extends: .php_template
  stage: test
  script:
    - composer install --no-interaction --prefer-dist
    - ./vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,info,txt,md ./web/modules/custom || true
  allow_failure: true

# PHPStan static analysis
phpstan:
  extends: .php_template
  stage: test
  script:
    - composer install --no-interaction --prefer-dist
    - ./vendor/bin/phpstan analyse web/modules/custom --level=5 || true
  allow_failure: true