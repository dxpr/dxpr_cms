# GitLab CI configuration for DXPR CMS
# Includes GitLab Pages deployment for MkDocs documentation

stages:
  - deploy

# GitLab Pages job for MkDocs documentation
pages:
  stage: deploy
  image: python:3.11-alpine
  rules:
    # Skip on tags
    - if: '$CI_COMMIT_TAG'
      when: never
    # Run automatically on version branches (pattern: [0-9]+.[0-9]+.x)
    - if: '$CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.x$/'
      changes:
        - docs/**/*
        - mkdocs.yml
        - .gitlab-ci.yml
      when: always
    # Run automatically on default branch (0.x) and 1.x branch
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - mkdocs.yml
        - .gitlab-ci.yml
      when: always
    - if: '$CI_COMMIT_REF_NAME == "1.x"'
      changes:
        - docs/**/*
        - mkdocs.yml
        - .gitlab-ci.yml
      when: always
  before_script:
    - apk add --no-cache git
    - pip install --no-cache-dir mkdocs mkdocs-material
  script:
    - echo "Building documentation for DXPR CMS"
    - echo "Project URL will be $CI_PAGES_URL"

    # Build the documentation (remove --strict to avoid warnings causing failures)
    - mkdocs build --site-dir public --verbose

    # Create a simple 404 page
    - |
      cat > public/404.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
          <title>404 - Page Not Found</title>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
              body { font-family: system-ui, sans-serif; text-align: center; padding: 50px; }
              h1 { color: #4051b5; }
              a { color: #4051b5; text-decoration: none; }
              a:hover { text-decoration: underline; }
          </style>
      </head>
      <body>
          <h1>404 - Page Not Found</h1>
          <p>The page you're looking for doesn't exist.</p>
          <p><a href="/">← Back to Documentation</a></p>
      </body>
      </html>
      EOF

    # Add GitLab Pages specific files
    - echo "Documentation build complete"
    - ls -la public/
  artifacts:
    paths:
      - public
    expire_in: 1 week

